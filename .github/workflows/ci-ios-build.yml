name: iOS Build

on:
  workflow_call:
    inputs:
      ios_cache_strategy:
        description: Compiler cache strategy for an opt-in hosted iOS build
        required: false
        type: string
        default: standard
      ios_cache_scenario:
        description: Temporary generated-app change used by the cache spike
        required: false
        type: string
        default: unchanged
    secrets:
      EXPO_TOKEN:
        required: true

permissions:
  contents: read

env:
  MISE_ENV: ci
  IOS_DEVICE: ${{ vars.IOS_DEVICE || 'iPhone 17' }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  EAS_PROJECT_SLUG: ${{ vars.EAS_PROJECT_SLUG }}
  RETRIES: ${{ vars.RETRIES }}
  RETRY_DELAY: ${{ vars.RETRY_DELAY }}
  IOS_CACHE_STRATEGY: ${{ inputs.ios_cache_strategy || 'standard' }}
  IOS_CACHE_SCENARIO: ${{ inputs.ios_cache_scenario || 'unchanged' }}
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
  # Fake Firebase credentials for CI builds (withFirebaseCredentials.js reads these)
  GOOGLE_SERVICE_INFO_PLIST_B64: ''
  GOOGLE_SERVICES_JSON_B64: ''

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ios_cache_strategy || 'standard' }}-${{ inputs.ios_cache_scenario || 'unchanged' }}
  cancel-in-progress: true

jobs:
  ios-hosted:
    name: Build (iOS) - Hosted MacOS
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo-template-testing

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start hosted iOS job timer
        id: ios-job-timer
        working-directory: ${{ github.workspace }}
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated GnuPG home for mise
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gnupg"
          chmod 700 "${RUNNER_TEMP}/gnupg"

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.2.13'
          install: true
          log_level: ${{ runner.debug == '1' && 'debug' || 'info' }}
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.mise.toml') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve CLI versions for artifact caching
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          create_expo_app_version=$(npm view "create-expo-app@$CREATE_EXPO_APP_VERSION" version)
          eas_cli_version=$(npm view "eas-cli@$EAS_CLI_VERSION" version)
          test -n "$create_expo_app_version"
          test -n "$eas_cli_version"
          echo "CREATE_EXPO_APP_VERSION=$create_expo_app_version" >> "$GITHUB_ENV"
          echo "EAS_CLI_VERSION=$eas_cli_version" >> "$GITHUB_ENV"

      - name: Scaffold with locked dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          npx --yes create-expo-app@"$CREATE_EXPO_APP_VERSION" expo-template-testing --template "$GITHUB_WORKSPACE" --yes --no-install
          cp package-lock.json expo-template-testing/package-lock.json
          cd expo-template-testing
          npm ci --prefer-offline --no-audit --no-fund
          # Validate against the pinned SDK map rather than mutable server recommendations.
          EXPO_OFFLINE=1 npx expo install --check

      - name: Configure ARM64-only simulator build
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cp "$GITHUB_WORKSPACE/.github/scripts/ios_simulator_arch.mjs" .ci-ios-simulator.mjs
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const hook = pkg.scripts['eas-build-post-install'];
          pkg.scripts['eas-build-post-install'] =
            (hook ? `(${hook}) && ` : '') + 'node .ci-ios-simulator.mjs';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Inject EAS projectId, slug and owner into app.config.ts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = './app.config.ts';
          const EAS_PROJECT_ID = '${{ env.EAS_PROJECT_ID }}';

          if (!fs.existsSync(path)) {
            console.error(`app.config.ts not found at ${path}`);
            process.exit(1);
          }

          let src = fs.readFileSync(path, 'utf8');
          src = src.replace(/extra:\s*\{/, `extra: {\n      eas: { projectId: '${EAS_PROJECT_ID}' },`);
          src = src.replace(/slug:\s*'[^']*'/, `slug: '${{ env.EAS_PROJECT_SLUG }}'`);
          fs.writeFileSync(path, src);
          console.log('Updated app.config.ts with extra.eas.projectId and slug.');
          NODE

      - name: Prepare generated app for the iOS cache spike
        if: env.IOS_CACHE_STRATEGY != 'standard'
        shell: bash
        env:
          IOS_CACHE_SPIKE_MARKER: ios-cache-spike-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.github/scripts/ios_build_cache_spike.mjs" \
            prepare "$GITHUB_WORKSPACE/expo-template-testing" \
            "$IOS_CACHE_STRATEGY" "$IOS_CACHE_SCENARIO" "$IOS_CACHE_SPIKE_MARKER"
          {
            echo "IOS_CACHE_STRATEGY=$IOS_CACHE_STRATEGY"
            echo "IOS_CACHE_SCENARIO=$IOS_CACHE_SCENARIO"
            echo "IOS_CACHE_SPIKE_MARKER=$IOS_CACHE_SPIKE_MARKER"
          } >> "$GITHUB_ENV"
          if [ "$IOS_CACHE_STRATEGY" = 'ccache' ]; then
            echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"
            echo 'CCACHE_MAXSIZE=5G' >> "$GITHUB_ENV"
          elif [ "$IOS_CACHE_STRATEGY" = 'deriveddata' ]; then
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-ios-cache-spike" >> "$GITHUB_ENV"
            echo "IOS_DERIVEDDATA_CACHE_DIR=$RUNNER_TEMP/eas-ios-cache-spike-deriveddata" >> "$GITHUB_ENV"
            echo 'EAS_LOCAL_BUILD_SKIP_CLEANUP=1' >> "$GITHUB_ENV"
            rm -rf "$RUNNER_TEMP/eas-ios-cache-spike"
            rm -rf "$RUNNER_TEMP/eas-ios-cache-spike-deriveddata"
          fi

      - name: Install Ccache for the iOS cache spike
        if: env.IOS_CACHE_STRATEGY == 'ccache'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          ccache --version

      - name: Compute iOS compiler cache key
        id: ios-compile-cache-key
        if: env.IOS_CACHE_STRATEGY == 'ccache' || env.IOS_CACHE_STRATEGY == 'deriveddata'
        shell: bash
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/ios_build_cache_spike.mjs" \
            key "$GITHUB_WORKSPACE/expo-template-testing" \
            "$IOS_CACHE_STRATEGY" >> "$GITHUB_OUTPUT"

      - name: Start compiler cache restore timer
        id: ios-cache-restore-start
        if: env.IOS_CACHE_STRATEGY == 'ccache' || env.IOS_CACHE_STRATEGY == 'deriveddata'
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Restore Ccache
        id: ccache-cache
        if: env.IOS_CACHE_STRATEGY == 'ccache'
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.ios-compile-cache-key.outputs.key }}

      - name: Restore Xcode DerivedData
        id: deriveddata-cache
        if: env.IOS_CACHE_STRATEGY == 'deriveddata'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/eas-ios-cache-spike-deriveddata
          key: ${{ steps.ios-compile-cache-key.outputs.key }}

      - name: Expose DerivedData cache status to the local build
        if: env.IOS_CACHE_STRATEGY == 'deriveddata'
        shell: bash
        env:
          DERIVEDDATA_CACHE_HIT: ${{ steps.deriveddata-cache.outputs.cache-hit || 'false' }}
        run: echo "IOS_DERIVEDDATA_CACHE_HIT=$DERIVEDDATA_CACHE_HIT" >> "$GITHUB_ENV"

      - name: Record compiler cache restore time
        id: ios-cache-restore-time
        if: env.IOS_CACHE_STRATEGY == 'ccache' || env.IOS_CACHE_STRATEGY == 'deriveddata'
        shell: bash
        env:
          RESTORE_STARTED_AT: ${{ steps.ios-cache-restore-start.outputs.started }}
        run: |
          seconds=$(( $(date +%s) - RESTORE_STARTED_AT ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "Compiler cache restore took ${seconds}s."

      - name: Compute iOS native build fingerprint
        id: ios_fp
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/compute_fingerprint.mjs" ios >> "$GITHUB_OUTPUT"

      - name: Restore the tar.gz iOS app
        id: ios_cache
        if: env.IOS_CACHE_STRATEGY == 'standard'
        uses: actions/cache/restore@v6
        with:
          path: expo-template-testing/*.tar.gz
          key: ${{ steps.ios_fp.outputs.key }}

      - name: Restore CocoaPods downloads
        id: pods-cache
        if: steps.ios_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'eas.json', '.mise.toml') }}
          restore-keys: |
            pods-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup Fastlane
        if: steps.ios_cache.outputs.cache-hit != 'true'
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/setup_fastlane.mjs" "$FASTLANE_VERSION"

      - name: Install EAS CLI
        if: steps.ios_cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm install --global "eas-cli@$EAS_CLI_VERSION" --prefer-online --no-audit --no-fund

      - name: Reset Ccache statistics before build
        if: env.IOS_CACHE_STRATEGY == 'ccache'
        shell: bash
        run: ccache --zero-stats

      - name: Build e2erelease
        id: eas-build
        if: steps.ios_cache.outputs.cache-hit != 'true' || env.IOS_CACHE_STRATEGY != 'standard'
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          BUILD_STARTED_AT=$(date +%s)
          ATTEMPTS="${RETRIES:-2}"
          DELAY="${RETRY_DELAY:-2}"
          i=1
          BUILD_STATUS=1
          while [ "$i" -le "$ATTEMPTS" ]; do
            echo "🏗️  iOS build attempt $i/$ATTEMPTS..."
            if eas build --platform ios --profile e2eRelease --local --non-interactive; then
              echo "✅ Build succeeded on attempt $i"
              BUILD_STATUS=0
              break
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "❌ Build attempt $i failed — retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
            i=$((i+1))
          done
          BUILD_SECONDS=$(( $(date +%s) - BUILD_STARTED_AT ))
          echo "seconds=$BUILD_SECONDS" >> "$GITHUB_OUTPUT"
          echo "Native build elapsed: ${BUILD_SECONDS}s"
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "❌ Build failed after $ATTEMPTS attempts"
            exit 1
          fi

      - name: Save CocoaPods cache (post-build)
        if: always() && steps.pods-cache.outputs.cache-primary-key != '' && steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Save the tar.gz iOS app
        if: steps.ios_cache.outputs.cache-hit != 'true' && env.IOS_CACHE_STRATEGY == 'standard'
        uses: actions/cache/save@v6
        with:
          path: expo-template-testing/*.tar.gz
          key: ${{ steps.ios_fp.outputs.key }}

      - name: Measure Ccache size and compiler statistics
        id: ccache-metrics
        if: env.IOS_CACHE_STRATEGY == 'ccache'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          size_kb=$(du -sk "$CCACHE_DIR" | awk '{print $1}')
          echo "size_kb=$size_kb" >> "$GITHUB_OUTPUT"
          echo '### Ccache compiler statistics' >> "$GITHUB_STEP_SUMMARY"
          ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Cache directory size: ${size_kb} KiB" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure Xcode DerivedData size
        id: deriveddata-metrics
        if: env.IOS_CACHE_STRATEGY == 'deriveddata'
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.github/scripts/ios_build_cache_spike.mjs" stage-deriveddata
          size_kb=$(du -sk "$IOS_DERIVEDDATA_CACHE_DIR" | awk '{print $1}')
          echo "size_kb=$size_kb" >> "$GITHUB_OUTPUT"
          echo "EAS iOS DerivedData size: ${size_kb} KiB" >> "$GITHUB_STEP_SUMMARY"

      - name: Start compiler cache save timer
        id: ios-cache-save-start
        if: env.IOS_CACHE_STRATEGY == 'ccache' || env.IOS_CACHE_STRATEGY == 'deriveddata'
        shell: bash
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Save Ccache
        id: ccache-save
        if: success() && env.IOS_CACHE_STRATEGY == 'ccache' && env.IOS_CACHE_SCENARIO != 'native-config' && steps.ccache-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.ios-compile-cache-key.outputs.key }}

      - name: Save Xcode DerivedData
        id: deriveddata-save
        if: success() && env.IOS_CACHE_STRATEGY == 'deriveddata' && env.IOS_CACHE_SCENARIO != 'native-config' && steps.deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/eas-ios-cache-spike-deriveddata
          key: ${{ steps.ios-compile-cache-key.outputs.key }}

      - name: Record compiler cache save time
        id: ios-cache-save-time
        if: always() && (env.IOS_CACHE_STRATEGY == 'ccache' || env.IOS_CACHE_STRATEGY == 'deriveddata')
        shell: bash
        env:
          CACHE_SAVE_STARTED_AT: ${{ steps.ios-cache-save-start.outputs.started }}
        run: |
          if [ -n "$CACHE_SAVE_STARTED_AT" ]; then
            seconds=$(( $(date +%s) - CACHE_SAVE_STARTED_AT ))
            echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
            echo "Compiler cache save elapsed: ${seconds}s."
          else
            echo 'seconds=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare current iOS JS bundle for repack
        if: steps.ios_cache.outputs.cache-hit == 'true' && env.IOS_CACHE_STRATEGY == 'standard'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          npx expo export --platform ios --output-dir ./dist --clear
          echo "expo-export" > dist/.bundle-source

      - name: Validate iOS Hermes bundle before repack
        if: steps.ios_cache.outputs.cache-hit == 'true' && env.IOS_CACHE_STRATEGY == 'standard'
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/validate_hermes_bundle.mjs" ios

      - name: Repack cached iOS app with current JS bundle
        if: steps.ios_cache.outputs.cache-hit == 'true' && env.IOS_CACHE_STRATEGY == 'standard'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p extracted_app
          tar -xzf "$ARCHIVE" -C extracted_app
          SOURCE_APP="$(find extracted_app -maxdepth 6 -type d -name '*.app' -print -quit)"
          test -n "$SOURCE_APP"

          REPACKED_APP="repacked_output.app"
          rm -rf "$REPACKED_APP"
          npx @expo/repack-app --platform ios --source-app "$SOURCE_APP" --output "$REPACKED_APP"
          test -d "$REPACKED_APP"
          rm -rf "$SOURCE_APP"
          mv "$REPACKED_APP" "$SOURCE_APP"

          REPACKED_ARCHIVE="${ARCHIVE%.tar.gz}.repacked.tar.gz"
          tar -czf "$REPACKED_ARCHIVE" -C extracted_app .
          mv "$REPACKED_ARCHIVE" "$ARCHIVE"

      - name: Verify current JavaScript in the cache-spike app
        id: verify-cache-spike-js
        if: env.IOS_CACHE_STRATEGY != 'standard' && (env.IOS_CACHE_SCENARIO == 'javascript-only' || env.IOS_CACHE_SCENARIO == 'native-config')
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p extracted_cache_spike_app
          tar -xzf "$ARCHIVE" -C extracted_cache_spike_app
          APP="$(find extracted_cache_spike_app -maxdepth 6 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          node "$GITHUB_WORKSPACE/.github/scripts/ios_build_cache_spike.mjs" \
            verify-js "$APP" "$IOS_CACHE_SPIKE_MARKER"

      - name: Upload iOS test inputs
        if: env.IOS_CACHE_STRATEGY == 'standard'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-inputs
          path: |
            expo-template-testing/*.tar.gz
            expo-template-testing/.maestro
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Upload Xcode build artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-build-artifacts-ios-hosted
          path: |
            expo-template-testing/ios/build/**/*.xcresult
            expo-template-testing/ios/build/**/*.log
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.log
          if-no-files-found: ignore

      - name: Summarize hosted iOS cache spike
        if: always() && env.IOS_CACHE_STRATEGY != 'standard'
        shell: bash
        env:
          IOS_CACHE_HIT: ${{ env.IOS_CACHE_STRATEGY == 'ccache' && steps.ccache-cache.outputs.cache-hit || env.IOS_CACHE_STRATEGY == 'deriveddata' && steps.deriveddata-cache.outputs.cache-hit || 'not-applicable' }}
          IOS_CACHE_RESTORE_SECONDS: ${{ steps.ios-cache-restore-time.outputs.seconds || 'n/a' }}
          IOS_CACHE_SAVE_SECONDS: ${{ steps.ios-cache-save-time.outputs.seconds || 'n/a' }}
          IOS_BUILD_SECONDS: ${{ steps.eas-build.outputs.seconds || 'n/a' }}
          IOS_CACHE_SIZE_KB: ${{ steps.ccache-metrics.outputs.size_kb || steps.deriveddata-metrics.outputs.size_kb || 'n/a' }}
          IOS_JS_MARKER_STATUS: ${{ steps.verify-cache-spike-js.outcome || 'not-applicable' }}
          IOS_JOB_STARTED_AT: ${{ steps.ios-job-timer.outputs.started }}
        run: |
          set -euo pipefail
          if [ -n "$IOS_JOB_STARTED_AT" ]; then
            TOTAL_SECONDS=$(( $(date +%s) - IOS_JOB_STARTED_AT ))
          else
            TOTAL_SECONDS='n/a'
          fi
          {
            echo '### Hosted iOS cache spike'
            echo
            echo '| Metric | Result |'
            echo '| --- | --- |'
            echo "| Strategy | $IOS_CACHE_STRATEGY |"
            echo "| Scenario | $IOS_CACHE_SCENARIO |"
            echo "| Compiler cache hit | $IOS_CACHE_HIT |"
            echo "| Cache restore | ${IOS_CACHE_RESTORE_SECONDS}s |"
            echo "| EAS/Xcode build | ${IOS_BUILD_SECONDS}s |"
            echo "| Cache size before save | ${IOS_CACHE_SIZE_KB} KiB |"
            echo "| Cache save | ${IOS_CACHE_SAVE_SECONDS}s |"
            echo "| Hosted build job total | ${TOTAL_SECONDS}s |"
            echo "| Current JS bundle check | $IOS_JS_MARKER_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

  ios-e2e:
    name: E2E (iOS) - Hosted MacOS
    needs: ios-hosted
    if: inputs.ios_cache_strategy == '' || inputs.ios_cache_strategy == 'standard'
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: expo-template-testing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare isolated GnuPG home for mise
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gnupg"
          chmod 700 "${RUNNER_TEMP}/gnupg"

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.2.13'
          install: true
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Download iOS test inputs
        uses: actions/download-artifact@v8
        with:
          name: ios-test-inputs
          path: expo-template-testing

      - name: Setup Maestro
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/setup_maestro.mjs" "$MAESTRO_VERSION"

      - name: Locate .app artifact
        id: find_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted_app
          tar -xzf "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)" -C extracted_app
          APP=$(find extracted_app -maxdepth 6 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        shell: bash
        timeout-minutes: 8
        run: node "$GITHUB_WORKSPACE/.github/scripts/ios_boot_simulator.mjs"

      - name: Install on simulator
        shell: bash
        timeout-minutes: 5
        run: node "$GITHUB_WORKSPACE/.github/scripts/ios_install_app.mjs" "${{ steps.find_app.outputs.app }}"

      - name: Run E2E tests
        shell: bash
        timeout-minutes: 10
        run: node "$GITHUB_WORKSPACE/.github/scripts/ios_run_e2e.mjs"

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-ios-hosted
          path: |
            expo-template-testing/e2e-artifacts
            ~/.maestro/tests
          include-hidden-files: true
          if-no-files-found: ignore
