name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc'
      - '.prettierrc.*'
      - '.eslintrc'
      - '.eslintrc.*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc'
      - '.prettierrc.*'
      - '.eslintrc'
      - '.eslintrc.*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENV: ci
  ANDROID_TARGET: 'google_apis'
  ANDROID_API_LEVEL: 35
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  EAS_PROJECT_SLUG: ${{ vars.EAS_PROJECT_SLUG }}
  RETRIES: ${{ vars.RETRIES }}
  RETRY_DELAY: ${{ vars.RETRY_DELAY }}
  # Fake Firebase credentials for CI builds (withFirebaseCredentials.js reads these)
  GOOGLE_SERVICE_INFO_PLIST_B64: ''
  GOOGLE_SERVICES_JSON_B64: ''

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-hosted:
    name: Build • E2E (Android) - Hosted Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo-template-testing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated GnuPG home for mise
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gnupg"
          chmod 700 "${RUNNER_TEMP}/gnupg"

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.2.13'
          install: true
          log_level: ${{ runner.debug == '1' && 'debug' || 'info' }}
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.mise.toml') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve CLI versions for artifact caching
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          create_expo_app_version=$(npm view "create-expo-app@$CREATE_EXPO_APP_VERSION" version)
          eas_cli_version=$(npm view "eas-cli@$EAS_CLI_VERSION" version)
          test -n "$create_expo_app_version"
          test -n "$eas_cli_version"
          echo "CREATE_EXPO_APP_VERSION=$create_expo_app_version" >> "$GITHUB_ENV"
          echo "EAS_CLI_VERSION=$eas_cli_version" >> "$GITHUB_ENV"

      - name: Scaffold with locked dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          npx --yes create-expo-app@"$CREATE_EXPO_APP_VERSION" expo-template-testing --template "$GITHUB_WORKSPACE" --yes --no-install
          cp package-lock.json expo-template-testing/package-lock.json
          cd expo-template-testing
          npm ci --prefer-offline --no-audit --no-fund
          # Validate against the pinned SDK map rather than mutable server recommendations.
          EXPO_OFFLINE=1 npx expo install --check

      - name: Setup Maestro
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup_maestro.sh" "$MAESTRO_VERSION"

      - name: Inject EAS projectId, slug and owner into app.config.ts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = './app.config.ts';
          const EAS_PROJECT_ID = '${{ env.EAS_PROJECT_ID }}';

          if (!fs.existsSync(path)) {
            console.error(`app.config.ts not found at ${path}`);
            process.exit(1);
          }

          let src = fs.readFileSync(path, 'utf8');
          src = src.replace(/extra:\s*\{/, `extra: {\n      eas: { projectId: '${EAS_PROJECT_ID}' },`);
          src = src.replace(/slug:\s*'[^']*'/, `slug: '${{ env.EAS_PROJECT_SLUG }}'`);
          fs.writeFileSync(path, src);
          console.log('Updated app.config.ts with extra.eas.projectId and slug.');
          NODE

      - name: Compute complete Android artifact cache key
        id: android_fingerprint
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/compute_ci_cache_key.sh" android >> "$GITHUB_OUTPUT"

      - name: Restore cached APK
        id: apk-cache
        uses: actions/cache/restore@v5
        with:
          path: expo-template-testing/*.apk
          key: ${{ steps.android_fingerprint.outputs.key }}

      - name: Cache Gradle dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'eas.json', '.mise.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Create debug keystore
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p android
          keytool -genkeypair -v \
            -keystore "android/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Write signing props for Gradle
        if: steps.apk-cache.outputs.cache-hit != 'true'
        run: |
          echo "android.injected.signing.store.file=$PWD/android/debug.keystore" >> android/gradle.properties
          echo "android.injected.signing.store.password=android"               >> android/gradle.properties
          echo "android.injected.signing.key.alias=androiddebugkey"            >> android/gradle.properties
          echo "android.injected.signing.key.password=android"                 >> android/gradle.properties

      - name: Restrict E2E APK to the emulator architecture
        if: steps.apk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          config.build.e2eRelease.android.gradleCommand = ':app:assembleRelease -PreactNativeArchitectures=x86_64';
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Install EAS CLI
        if: steps.apk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm install --global "eas-cli@$EAS_CLI_VERSION" --prefer-offline --no-audit --no-fund

      - name: Build e2erelease APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          ATTEMPTS="${RETRIES:-2}"
          DELAY="${RETRY_DELAY:-5}"

          for attempt in $(seq 1 "$ATTEMPTS"); do
            echo "🏗️ Build attempt $attempt/$ATTEMPTS"
            if eas build --platform android --profile e2eRelease --local --non-interactive; then
              echo "✅ Build succeeded"
              exit 0
            fi
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "⚠️ Build failed; retrying in $DELAY s..."
              sleep "$DELAY"
            fi
          done

          echo "❌ Build failed after $ATTEMPTS attempts"
          exit 1

      - name: Locate APK artifact & app.config.ts
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls -1t ./*.apk 2>/dev/null | head -n1 || true)"
          echo "APK=$APK"
          # Strip leading ./ for cache path compatibility
          APK_BASENAME="${APK#./}"
          echo "apk=$APK_BASENAME" >> $GITHUB_OUTPUT
          [ -n "$APK" ] || (echo "No APK found in repo root."; ls -alh .; exit 1)

          PKG=$(node -e "const fs=require('fs');const src=fs.readFileSync('./app.config.ts','utf8');const m=src.match(/const baseAndroidPackage\s*=\s*'([^']+)'/);console.log(m?m[1]:'')")
          echo "PKG=$PKG"
          echo "pkg=$PKG" >> $GITHUB_OUTPUT
          [ -n "$PKG" ] || (echo "No PKG found in repo root."; ls -alh .; exit 1)

      - name: Save APK to cache
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: expo-template-testing/*.apk
          key: ${{ steps.android_fingerprint.outputs.key }}

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-reports-android-hosted
          path: |
            expo-template-testing/android/build/reports/**
            expo-template-testing/android/app/build/reports/**
          if-no-files-found: ignore

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record emulator image version
        id: emulator-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache clean Android emulator snapshot
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: ~/.android/avd
          key: avd-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_API_LEVEL }}-${{ env.ANDROID_TARGET }}-x86_64-${{ steps.emulator-image.outputs.version }}

      - name: Create clean Android emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 10
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Clean emulator snapshot ready"

      - name: Run E2E tests
        id: e2e_android
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30 # Android emulators are slow
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          working-directory: expo-template-testing
          script: ../.github/scripts/android_run_e2e.sh ${{ steps.find_apk.outputs.apk }} ${{ steps.find_apk.outputs.pkg }}

      - name: Collect emulator logs on failure
        if: failure() && steps.e2e_android.outcome == 'failure'
        shell: bash
        run: |
          echo "Collecting emulator diagnostics..."
          mkdir -p e2e-artifacts
          adb logcat -d > e2e-artifacts/emulator.log || true
          adb shell "getprop" > e2e-artifacts/device-props.txt || true
          echo "✅ Logs collected"

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-android-hosted
          path: |
            expo-template-testing/e2e-artifacts/**/*
            expo-template-testing/android/app/build/reports/**
          include-hidden-files: true
