name: Quality CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc*'
      - '.eslintrc*'
      - 'CODEOWNERS'
      - 'LICENSE*'
      - 'renovate.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc*'
      - '.eslintrc*'
      - 'CODEOWNERS'
      - 'LICENSE*'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENV: ci

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-hosted:
    name: Quality Checks - Hosted Ubuntu
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo-template-testing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare isolated GnuPG home for mise
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gnupg"
          chmod 700 "${RUNNER_TEMP}/gnupg"

      - name: Setup mise toolchain
        uses: jdx/mise-action@v5
        with:
          version: '2026.11.12'
          install: true
          log_level: ${{ runner.debug == '1' && 'debug' || 'info' }}
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Check root repository tooling
        working-directory: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test --runInBand __tests__/scripts

      - name: Scaffold generated app
        id: scaffold
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf expo-template-testing
          npx create-expo-app expo-template-testing \
            --template "$GITHUB_WORKSPACE/template-sync" \
            --yes \
            --no-install
          node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" \
            stage expo-template-testing "$GITHUB_WORKSPACE/template-sync"

      - name: Setup pnpm for generated app
        if: ${{ steps.scaffold.outputs.manager == 'pnpm' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
          cache: true
          cache_dependency_path: expo-template-testing/pnpm-lock.yaml

      - name: Install generated app dependencies
        working-directory: expo-template-testing
        run: node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" install

      - name: Check installed Expo versions
        working-directory: expo-template-testing
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" exec expo --version
          node -e "console.log('react-native', require('react-native/package.json').version)"
          node -e "console.log('expo', require('expo/package.json').version)"

      - name: Verify Expo/RN dependency alignment
        id: expo_deps
        shell: bash
        run: node "$GITHUB_WORKSPACE/.github/scripts/verify_expo_deps.mjs"
        continue-on-error: true

      - name: Annotate Expo/RN dependency drift
        if: ${{ steps.expo_deps.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Expo/RN dependency drift detected. Run the matching Expo install command for the app lockfile manager and commit the lockfile changes."

      - name: Doctor
        id: expo_doctor
        run: node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" run doctor
        continue-on-error: true

      - name: Annotate Expo Doctor issues
        if: ${{ steps.expo_doctor.outcome == 'failure' }}
        shell: bash
        run: |
          echo "::error::Expo Doctor reported issues. Review the Doctor step logs for details."

      - name: Check formatting
        run: node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" run format:check

      - name: Lint
        run: node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" run lint

      - name: Unit tests
        run: node "$GITHUB_WORKSPACE/.github/scripts/generated-app-package-manager.mjs" run test -- --coverage --runInBand

      - name: Install GPG
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          slug: luvenapps/expo-template
          flags: quality
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          slug: luvenapps/expo-template
          flags: quality
          report_type: test_results
          fail_ci_if_error: false
