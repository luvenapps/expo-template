name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc'
      - '.prettierrc.*'
      - '.eslintrc'
      - '.eslintrc.*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc'
      - '.prettierrc.*'
      - '.eslintrc'
      - '.eslintrc.*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ENV: ci
  IOS_DEVICE: ${{ vars.IOS_DEVICE || 'iPhone 17' }}
  EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
  EAS_PROJECT_SLUG: ${{ vars.EAS_PROJECT_SLUG }}
  RETRIES: ${{ vars.RETRIES }}
  RETRY_DELAY: ${{ vars.RETRY_DELAY }}
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 180000
  # Fake Firebase credentials for CI builds (withFirebaseCredentials.js reads these)
  GOOGLE_SERVICE_INFO_PLIST_B64: ''
  GOOGLE_SERVICES_JSON_B64: ''

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-hosted:
    name: Build (iOS) - Hosted MacOS
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: expo-template-testing

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated GnuPG home for mise
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gnupg"
          chmod 700 "${RUNNER_TEMP}/gnupg"

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.2.13'
          install: true
          log_level: ${{ runner.debug == '1' && 'debug' || 'info' }}
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', '.mise.toml') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve CLI versions for artifact caching
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          create_expo_app_version=$(npm view "create-expo-app@$CREATE_EXPO_APP_VERSION" version)
          eas_cli_version=$(npm view "eas-cli@$EAS_CLI_VERSION" version)
          test -n "$create_expo_app_version"
          test -n "$eas_cli_version"
          echo "CREATE_EXPO_APP_VERSION=$create_expo_app_version" >> "$GITHUB_ENV"
          echo "EAS_CLI_VERSION=$eas_cli_version" >> "$GITHUB_ENV"

      - name: Scaffold with locked dependencies
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          npx --yes create-expo-app@"$CREATE_EXPO_APP_VERSION" expo-template-testing --template "$GITHUB_WORKSPACE" --yes --no-install
          cp package-lock.json expo-template-testing/package-lock.json
          cd expo-template-testing
          npm ci --prefer-offline --no-audit --no-fund
          # Validate against the pinned SDK map rather than mutable server recommendations.
          EXPO_OFFLINE=1 npx expo install --check

      - name: Inject EAS projectId, slug and owner into app.config.ts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = './app.config.ts';
          const EAS_PROJECT_ID = '${{ env.EAS_PROJECT_ID }}';

          if (!fs.existsSync(path)) {
            console.error(`app.config.ts not found at ${path}`);
            process.exit(1);
          }

          let src = fs.readFileSync(path, 'utf8');
          src = src.replace(/extra:\s*\{/, `extra: {\n      eas: { projectId: '${EAS_PROJECT_ID}' },`);
          src = src.replace(/slug:\s*'[^']*'/, `slug: '${{ env.EAS_PROJECT_SLUG }}'`);
          fs.writeFileSync(path, src);
          console.log('Updated app.config.ts with extra.eas.projectId and slug.');
          NODE

      - name: Compute complete iOS artifact cache key
        id: ios_fp
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/compute_ci_cache_key.sh" ios >> "$GITHUB_OUTPUT"

      - name: Restore the tar.gz iOS app
        id: ios_cache
        uses: actions/cache/restore@v5
        with:
          path: expo-template-testing/*.tar.gz
          key: ${{ steps.ios_fp.outputs.key }}

      - name: Setup Fastlane
        if: steps.ios_cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup_fastlane.sh" "$FASTLANE_VERSION"

      - name: Install EAS CLI
        if: steps.ios_cache.outputs.cache-hit != 'true'
        shell: bash
        run: npm install --global "eas-cli@$EAS_CLI_VERSION" --prefer-offline --no-audit --no-fund

      - name: Build e2erelease
        if: steps.ios_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          ATTEMPTS="${RETRIES:-2}"
          DELAY="${RETRY_DELAY:-2}"
          i=1
          while [ "$i" -le "$ATTEMPTS" ]; do
            echo "🏗️  iOS build attempt $i/$ATTEMPTS..."
            if eas build --platform ios --profile e2eRelease --local --non-interactive; then
              echo "✅ Build succeeded on attempt $i"
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "❌ Build attempt $i failed — retrying in ${DELAY}s..."
              sleep "$DELAY"
            fi
            i=$((i+1))
          done
          echo "❌ Build failed after $ATTEMPTS attempts"
          exit 1

      - name: Save the tar.gz iOS app
        if: steps.ios_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: expo-template-testing/*.tar.gz
          key: ${{ steps.ios_fp.outputs.key }}

      - name: Upload iOS test inputs
        uses: actions/upload-artifact@v6
        with:
          name: ios-test-inputs
          path: |
            expo-template-testing/*.tar.gz
            expo-template-testing/.maestro
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

      - name: Upload Xcode build artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: xcode-build-artifacts-ios-hosted
          path: |
            expo-template-testing/ios/build/**/*.xcresult
            expo-template-testing/ios/build/**/*.log
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.log
          if-no-files-found: ignore

  ios-e2e:
    name: E2E (iOS) - Hosted MacOS
    needs: ios-hosted
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: expo-template-testing
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated GnuPG home for mise
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gnupg"
          chmod 700 "${RUNNER_TEMP}/gnupg"

      - name: Setup mise toolchain
        uses: jdx/mise-action@v3
        with:
          version: '2026.2.13'
          install: true
        env:
          GNUPGHOME: ${{ runner.temp }}/gnupg
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Download iOS test inputs
        uses: actions/download-artifact@v7
        with:
          name: ios-test-inputs
          path: expo-template-testing

      - name: Setup Maestro
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/setup_maestro.sh" "$MAESTRO_VERSION"

      - name: Locate .app artifact
        id: find_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted_app
          tar -xzf "$(find . -maxdepth 1 -name '*.tar.gz' -print -quit)" -C extracted_app
          APP=$(find extracted_app -maxdepth 6 -type d -name '*.app' -print -quit)
          test -n "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        shell: bash
        timeout-minutes: 8
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ios_boot_simulator.sh"

      - name: Install on simulator
        shell: bash
        timeout-minutes: 5
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ios_install_app.sh" "${{ steps.find_app.outputs.app }}"

      - name: Run E2E tests
        shell: bash
        timeout-minutes: 10
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ios_run_e2e.sh"

      - name: Upload E2E diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-ios-hosted
          path: |
            expo-template-testing/e2e-artifacts
            ~/.maestro/tests
          include-hidden-files: true
          if-no-files-found: ignore
