name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc'
      - '.prettierrc.*'
      - '.eslintrc'
      - '.eslintrc.*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.nvmrc'
      - '.node-version'
      - '.prettierignore'
      - '.prettierrc'
      - '.prettierrc.*'
      - '.eslintrc'
      - '.eslintrc.*'
      - 'CODEOWNERS'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      ios_cache_strategy:
        description: Compiler cache strategy for a one-off hosted iOS build
        required: true
        type: choice
        options:
          - standard
          - none
          - ccache
          - deriveddata
        default: standard
      ios_cache_scenario:
        description: Temporary generated-app change used by the cache spike
        required: true
        type: choice
        options:
          - unchanged
          - javascript-only
          - native-config
        default: unchanged

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-standard:
    name: Standard iOS build and E2E
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: ${{ inputs.ios_cache_strategy || 'standard' }}
      ios_cache_scenario: ${{ inputs.ios_cache_scenario || 'unchanged' }}
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  detect-cache-spike:
    name: Detect iOS cache spike changes
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run_benchmarks: ${{ steps.changed-files.outputs.run_benchmarks }}
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check benchmark workflow inputs
        id: changed-files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" | grep -Fxq \
            -e '.github/scripts/ios_build_cache_spike.mjs' \
            -e '.github/workflows/ci-ios.yml' \
            -e '.github/workflows/ci-ios-build.yml'; then
            echo 'run_benchmarks=true' >> "$GITHUB_OUTPUT"
            echo 'Cache spike files changed; running the benchmark sequence.'
          else
            echo 'run_benchmarks=false' >> "$GITHUB_OUTPUT"
            echo 'No cache spike files changed; skipping the benchmark sequence.'
          fi

  baseline:
    name: Baseline (no compiler cache, unchanged app)
    needs: detect-cache-spike
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: none
      ios_cache_scenario: unchanged
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ccache-cold:
    name: Ccache (cold cache, unchanged app)
    needs: [detect-cache-spike, baseline]
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: ccache
      ios_cache_scenario: unchanged
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ccache-javascript:
    name: Ccache (warm cache, JavaScript-only change)
    needs: [detect-cache-spike, ccache-cold]
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: ccache
      ios_cache_scenario: javascript-only
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  ccache-native-config:
    name: Ccache (native-config cache miss)
    needs: [detect-cache-spike, ccache-javascript]
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: ccache
      ios_cache_scenario: native-config
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  deriveddata-cold:
    name: DerivedData (cold cache, unchanged app)
    needs: [detect-cache-spike, ccache-native-config]
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: deriveddata
      ios_cache_scenario: unchanged
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  deriveddata-javascript:
    name: DerivedData (warm cache, JavaScript-only change)
    needs: [detect-cache-spike, deriveddata-cold]
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: deriveddata
      ios_cache_scenario: javascript-only
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  deriveddata-native-config:
    name: DerivedData (native-config cache miss)
    needs: [detect-cache-spike, deriveddata-javascript]
    if: needs.detect-cache-spike.outputs.run_benchmarks == 'true'
    uses: ./.github/workflows/ci-ios-build.yml
    with:
      ios_cache_strategy: deriveddata
      ios_cache_scenario: native-config
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
