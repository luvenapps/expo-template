name: Prepare template source sync

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository in owner/name form
        required: true
        default: luvenapps/betterhabits
        type: string
      source_branch:
        description: Source branch or tag to snapshot
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: template-source-sync
  cancel-in-progress: false

jobs:
  prepare-sync:
    name: Prepare reviewed sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Require sync tokens
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TEMPLATE_AUTOMATION_TOKEN: ${{ secrets.TEMPLATE_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Add SOURCE_REPO_TOKEN with read access to the selected source repository."
            exit 1
          fi
          if [ -z "$TEMPLATE_AUTOMATION_TOKEN" ]; then
            echo "::error::Add TEMPLATE_AUTOMATION_TOKEN with contents and pull request write access to expo-template."
            exit 1
          fi

      - name: Check out sync tooling
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TEMPLATE_AUTOMATION_TOKEN }}

      - name: Check out expo-template main
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.TEMPLATE_AUTOMATION_TOKEN }}
          fetch-depth: 0
          path: target-repository

      - name: Check out source snapshot
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source-repository
          fetch-depth: 0
          persist-credentials: true

      - name: Sync source files into template form
        id: sync
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          GH_TOKEN: ${{ secrets.TEMPLATE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          git -C target-repository config user.name "github-actions[bot]"
          git -C target-repository config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/sync-template-source.mjs \
            --source-dir source-repository \
            --target-dir target-repository \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-branch "$SOURCE_BRANCH" \
            --yes

