name: Prepare template source sync

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: Source repository in owner/name form
        required: true
        default: luvenapps/betterhabits
        type: string
      source_branch:
        description: Source branch or tag to snapshot
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: template-source-sync
  cancel-in-progress: false

jobs:
  prepare-sync:
    name: Prepare reviewed sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out expo-template main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Require source read token
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          TEMPLATE_AUTOMATION_TOKEN: ${{ secrets.TEMPLATE_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Add SOURCE_REPO_TOKEN with read access to the selected source repository."
            exit 1
          fi
          if [ -z "$TEMPLATE_AUTOMATION_TOKEN" ]; then
            echo "::error::Add TEMPLATE_AUTOMATION_TOKEN with contents and pull request write access to expo-template."
            exit 1
          fi

      - name: Check out source snapshot
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source-repository
          fetch-depth: 0
          persist-credentials: false

      - name: Sync source files into template form
        id: sync
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail

          node scripts/sync-template-source.mjs \
            --source-dir source-repository \
            --target-dir .

          source_sha="$(git -C source-repository rev-parse HEAD)"
          previous_sha="$(jq -r \
            --arg repo "$SOURCE_REPOSITORY" \
            --arg branch "$SOURCE_BRANCH" \
            '.sources[$repo][$branch] // empty' \
            .template-sync-manifest.json)"

          if [ -n "$previous_sha" ]; then
            if ! git -C source-repository merge-base --is-ancestor "$previous_sha" "$source_sha"; then
              echo "::error::Last synced source commit $previous_sha is not an ancestor of $SOURCE_REPOSITORY@$SOURCE_BRANCH. Update .template-sync-manifest.json after reviewing the source history rewrite."
              exit 1
            fi

            source_commits="$(git -C source-repository log \
              --reverse \
              --format='- `%h` %s' \
              "$previous_sha..$source_sha")"
            if [ -z "$source_commits" ]; then
              source_commits="- No new source commits since the previous sync."
            fi
          else
            source_commits="- No previous sync baseline is recorded for this repository and branch. This run establishes the baseline at \`$source_sha\`."
          fi

          delimiter="source_commits_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "source_sha=$source_sha"
            echo "source_commits<<$delimiter"
            printf '%s\n' "$source_commits"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

          jq \
            --arg repo "$SOURCE_REPOSITORY" \
            --arg branch "$SOURCE_BRANCH" \
            --arg sha "$source_sha" \
            '.sources[$repo] = (.sources[$repo] // {}) | .sources[$repo][$branch] = $sha' \
            .template-sync-manifest.json > .template-sync-manifest.json.tmp
          mv .template-sync-manifest.json.tmp .template-sync-manifest.json

      - name: Name sync branch
        id: branch
        run: echo "name=automation/template-source-sync-$(date -u +'%Y%m%d-%H%M%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TEMPLATE_AUTOMATION_TOKEN }}
          base: main
          branch: ${{ steps.branch.outputs.name }}
          delete-branch: false
          commit-message: 'chore: sync reusable app foundation'
          title: 'chore: sync reusable app foundation'
          body: |
            Refresh the reusable app foundation from `${{ inputs.source_repository }}@${{ steps.sync.outputs.source_sha }}`.

            Source commits since the last sync of this source branch:
            ${{ steps.sync.outputs.source_commits }}

            Review the diff for product-specific code, credentials, template bootstrap behavior, and hidden-file materialization. Run the generated-app checks in CI before merging.

            Source branch: `${{ inputs.source_branch }}`
